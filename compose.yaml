services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Configure .env}
      MYSQL_USER: ${MYSQL_USER:?Configure .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure .env}
    volumes:
      - alojamientos_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24
  backend:
    build:
      context: ./backend
      dockerfile: ../infra/Backend.Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:?Configure .env}
      DB_USER: ${MYSQL_USER:?Configure .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Configure .env}
      SECRET_KEY: ${SECRET_KEY:?Configure .env}
      JWT_EXP_MINUTES: ${JWT_EXP_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8080}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/Frontend.Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  alojamientos_mysql_data:
    external: true
